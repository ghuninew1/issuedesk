services:
    speed-test-server-agent:
        build: .
        container_name: speed-test-server-agent
        init: true
        read_only: true
        cap_drop: [ALL]
        security_opt: ["no-new-privileges:true"]
        cpus: 2
        mem_limit: 192m
        pids_limit: 64
        stop_grace_period: 8s
        env_file: .env
